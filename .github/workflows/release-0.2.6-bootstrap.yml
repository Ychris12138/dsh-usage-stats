name: release-0.2.6-bootstrap

on:
  push:
    branches:
      - chore/release-v0.2.6-npm

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/release-v0.2.6-npm
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/.release-0.2.6-prep.mjs
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Commit validated release synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json cordis.patch.yml catalog/v1/plugins.json README.md scripts/test-bundle.mjs scripts/test-install.mjs
          git add -u -- scripts/.release-0.2.6-prep.mjs .github/workflows/release-0.2.6-bootstrap.yml
          git commit -m "chore: prepare npm package and v0.2.6 metadata"
          git push origin HEAD:chore/release-v0.2.6-npm
