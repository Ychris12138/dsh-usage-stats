name: Apply panel dismissal and diagnostics

on:
  push:
    branches:
      - feat/panel-dismiss-and-diagnostics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/panel-dismiss-and-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply focused patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, found {n}")
              return text.replace(old, new, 1)

          client = Path("lib/client.js")
          text = client.read_text()

          helper_marker = "\n\t\t/**\n\t\t * Normalize server-provided account metadata for the single selector."
          helpers = r'''

		/** True when a pointer event happened outside both the portaled panel and its sidebar badge. */
		function shouldDismissPanel(path, target, layer, panel) {
			const eventPath = Array.isArray(path) ? path : [];
			const inside = (root) => root !== null && root !== void 0 && (
				eventPath.includes(root)
				|| (target !== null && target !== void 0 && typeof root.contains === "function" && root.contains(target))
			);
			return !inside(layer) && !inside(panel);
		}

		/** Defense-in-depth filter for server-provided, secret-free diagnostic reasons. */
		function safeDiagnosticReason(reason) {
			if (typeof reason !== "string") return null;
			const value = reason.trim();
			if (value === "" || value.length > 160) return null;
			if (/(authorization|bearer\s|api[_-]?key|cookie|token\s*[=:]|sk-[a-z0-9])/i.test(value)) return null;
			return value;
		}

		function diagnosticReasonText(reason, translate) {
			const value = safeDiagnosticReason(reason);
			if (value === null) return null;
			if (value === "dns-resolution-failed") return translate("account.reason.dnsResolutionFailed");
			if (value === "all-addresses-unreachable") return translate("account.reason.allAddressesUnreachable");
			return value;
		}
'''
          if helper_marker not in text:
              raise SystemExit("helper marker missing")
          text = text.replace(helper_marker, helpers + helper_marker, 1)

          text = once(
              text,
              "\t\t\tconst layerRef = react.useRef(null);\n",
              "\t\t\tconst layerRef = react.useRef(null);\n\t\t\tconst panelRef = react.useRef(null);\n",
              "panel ref"
          )

          effect_marker = "\n\t\t\t// Keep exactly one valid provider selected across independent provider"
          effect = r'''

			// Utility-popover dismissal: the panel is portaled to document.body, so
			// use capture-phase pointerdown + composedPath rather than DOM ancestry.
			react.useEffect(() => {
				if (!open) return void 0;
				const onPointerDown = (event) => {
					const path = typeof event.composedPath === "function" ? event.composedPath() : [];
					if (shouldDismissPanel(path, event.target, layerRef.current, panelRef.current)) setOpen(false);
				};
				const onKeyDown = (event) => {
					if (event.key === "Escape") setOpen(false);
				};
				document.addEventListener("pointerdown", onPointerDown, true);
				document.addEventListener("keydown", onKeyDown, true);
				return () => {
					document.removeEventListener("pointerdown", onPointerDown, true);
					document.removeEventListener("keydown", onKeyDown, true);
				};
			}, [open]);
'''
          if effect_marker not in text:
              raise SystemExit("effect marker missing")
          text = text.replace(effect_marker, effect + effect_marker, 1)

          text = once(
              text,
              'open && react_dom.createPortal(react_jsx_runtime.jsxs("section", {\n\t\t\t\t\t\tclassName: S.panel,',
              'open && react_dom.createPortal(react_jsx_runtime.jsxs("section", {\n\t\t\t\t\t\tref: panelRef,\n\t\t\t\t\t\tclassName: S.panel,',
              "panel ref attachment"
          )

          text = once(
              text,
              '\t\t\tconst balanceMessage = accountError ?? account?.missingCredentials?.[0] ?? status;\n',
              '\t\t\tconst balanceMessage = accountError ?? account?.missingCredentials?.[0] ?? status;\n\t\t\tconst reasonText = diagnosticReasonText(account?.reason, translate);\n',
              "reason calculation"
          )

          body_line = '\t\t\t\t\t\t: react_jsx_runtime.jsx(BalanceContent, { balance: account?.balance ?? null, state: balanceState, message: balanceMessage, translate, onRetry })\n'
          text = once(
              text,
              body_line,
              body_line.rstrip("\n") + ',\n\t\t\t\t\treasonText !== null && status !== "ok" ? react_jsx_runtime.jsx("p", { className: S.note, children: reasonText }) : null\n',
              "reason render"
          )

          text = once(
              text,
              '\t\t\t"account.invalidResponse": "供应商返回了无法识别的额度数据。",\n',
              '\t\t\t"account.invalidResponse": "供应商返回了无法识别的额度数据。",\n\t\t\t"account.reason.dnsResolutionFailed": "无法解析供应商域名。",\n\t\t\t"account.reason.allAddressesUnreachable": "已验证的网络地址均无法连接。",\n',
              "zh reason strings"
          )
          text = once(
              text,
              '\t\t\t"account.invalidResponse": "The provider returned unrecognized quota data.",\n',
              '\t\t\t"account.invalidResponse": "The provider returned unrecognized quota data.",\n\t\t\t"account.reason.dnsResolutionFailed": "The provider hostname could not be resolved.",\n\t\t\t"account.reason.allAddressesUnreachable": "None of the validated network addresses could be reached.",\n',
              "en reason strings"
          )

          text = once(
              text,
              '\t\texports.badgeWarnOf = badgeWarnOf;\n',
              '\t\texports.badgeWarnOf = badgeWarnOf;\n\t\texports.shouldDismissPanel = shouldDismissPanel;\n\t\texports.safeDiagnosticReason = safeDiagnosticReason;\n',
              "helper exports"
          )
          client.write_text(text)

          smoke = Path("scripts/smoke-client.mjs")
          text = smoke.read_text()
          anchor = 'if (!source.includes(\'host.style.flexDirection = "column"\')) throw new Error("client must stack the host footer-actions container vertically (#21)");\n'
          text = once(
              text,
              anchor,
              anchor + 'if (!source.includes(\'document.addEventListener("pointerdown"\')) throw new Error("open panel must listen for outside pointerdown");\nif (!source.includes(\'event.key === "Escape"\')) throw new Error("open panel must dismiss on Escape");\nif (!source.includes("ref: panelRef")) throw new Error("portaled panel must expose a ref for outside-click detection");\n',
              "source UX assertions"
          )

          anchor = 'if (typeof exports_.apply !== "function") throw new Error("missing apply export");\n'
          tests = '''if (typeof exports_.apply !== "function") throw new Error("missing apply export");

const { shouldDismissPanel, safeDiagnosticReason } = exports_;
const panelNode = { contains: (target) => target === "panel-child" };
const layerNode = { contains: (target) => target === "badge-child" };
if (shouldDismissPanel([panelNode], "panel-child", layerNode, panelNode)) throw new Error("panel click must stay open");
if (shouldDismissPanel([layerNode], "badge-child", layerNode, panelNode)) throw new Error("badge click must stay inside");
if (!shouldDismissPanel([], "page-content", layerNode, panelNode)) throw new Error("outside click must dismiss");
if (!shouldDismissPanel([], "page-content", null, null)) throw new Error("missing refs must fail safe as outside");
if (safeDiagnosticReason("all-addresses-unreachable") !== "all-addresses-unreachable") throw new Error("safe reason should pass");
if (safeDiagnosticReason("Authorization: Bearer secret") !== null) throw new Error("secret-like reason must be rejected");
if (safeDiagnosticReason("x".repeat(161)) !== null) throw new Error("oversized reason must be rejected");
console.log("panel dismissal and diagnostic guards ok");
'''
          text = once(text, anchor, tests, "pure helper tests")

          fixture = 'account: { id: "minimax", displayName: "MiniMax", mode: "subscription", status: "invalid-response", windows: [] },'
          text = once(
              text,
              fixture,
              'account: { id: "minimax", displayName: "MiniMax", mode: "subscription", status: "invalid-response", windows: [], reason: "all-addresses-unreachable" },',
              "reason fixture"
          )
          assertion = 'if (!invalidMarkup.includes("account.status.invalidResponse") || !invalidMarkup.includes("account.invalidResponse")) throw new Error("invalid account responses need a distinct status and explanation");\n'
          text = once(
              text,
              assertion,
              assertion + 'if (!invalidMarkup.includes("account.reason.allAddressesUnreachable")) throw new Error("safe diagnostic reason must render in account card");\n',
              "reason render assertion"
          )
          smoke.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check && npm test
      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/apply-panel-dismiss-and-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js scripts/smoke-client.mjs .github/workflows/apply-panel-dismiss-and-diagnostics.yml
          git commit -m "feat: dismiss panel on outside click and Escape"
          git push origin HEAD:feat/panel-dismiss-and-diagnostics
