name: Apply Node 24 pinned transport fix

on:
  push:
    branches: [fix/node24-pinned-transport]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor == 'Ychris12138'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/node24-pinned-transport
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply minimal transport patch and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          accounts = Path('lib/accounts.js')
          text = accounts.read_text()
          old = '''\t\t\tmethod: init?.method ?? "GET",\n\t\t\theaders: init?.headers,\n\t\t\tsignal,\n\t\t\tservername: isIP(url.hostname.replace(/^\\[|\\]$/g, "")) === 0 ? url.hostname : void 0,'''
          new = '''\t\t\tmethod: init?.method ?? "GET",\n\t\t\theaders: init?.headers,\n\t\t\tsignal,\n\t\t\t// Node 20+ enables network-family autoselection by default. Each outer\n\t\t\t// attempt is already pinned to one policy-approved address, so disable\n\t\t\t// the inner lookupAndConnectMultiple path and fix the intended family.\n\t\t\tfamily: address.family,\n\t\t\tautoSelectFamily: false,\n\t\t\tservername: isIP(url.hostname.replace(/^\\[|\\]$/g, "")) === 0 ? url.hostname : void 0,'''
          if old not in text:
              raise SystemExit('accounts.js patch marker not found')
          accounts.write_text(text.replace(old, new, 1))

          tests = Path('scripts/test-accounts.mjs')
          text = tests.read_text()
          if 'import { readFileSync } from "node:fs";' not in text:
              text = text.replace('import assert from "node:assert/strict";\n', 'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n', 1)

          marker = '''{\n\tconst attempts = [];\n\tconst spec = resolveAccountSpec(relay, validateAccountConfig({ monitors: {\n\t\t"relay-a": { adapter: "general" }\n\t} }));\n\tconst account = await queryAccount(spec, credentials({ RELAY_A_KEY: "sk-relay" }), {\n\t\tnow: () => now,\n\t\tlookup: async () => [\n\t\t\t{ address: "2606:4700:4700::1111", family: 6 },\n\t\t\t{ address: "1.1.1.1", family: 4 }\n\t\t],'''
          insertion = '''{\n\tconst source = readFileSync(new URL("../lib/accounts.js", import.meta.url), "utf8");\n\tassert.match(source, /family:\\s*address\\.family/, "each pinned request must fix the selected address family");\n\tassert.match(source, /autoSelectFamily:\\s*false/, "Node network-family autoselection must stay disabled inside each pinned attempt");\n\tconsole.log("Node 24 pinned request disables inner network-family autoselection ok");\n}\n\n{\n\tconst { createServer } = await import("node:http");\n\tconst server = createServer((req, res) => {\n\t\tassert.equal(req.url, "/user/balance");\n\t\tres.writeHead(200, { "content-type": "application/json" });\n\t\tres.end(JSON.stringify({ balance: 11, currency: "USD" }));\n\t});\n\tawait new Promise((resolve) => server.listen(0, "127.0.0.1", resolve));\n\tconst { port } = server.address();\n\ttry {\n\t\tconst localProvider = { ...relay, baseURL: `http://localhost:${port}/v1` };\n\t\tconst spec = resolveAccountSpec(localProvider, validateAccountConfig({ monitors: {\n\t\t\t"relay-a": { adapter: "general", allowPrivateNetwork: true, allowInsecure: true }\n\t\t} }));\n\t\tconst account = await queryAccount(spec, credentials({ RELAY_A_KEY: "sk-relay" }), {\n\t\t\tnow: () => now,\n\t\t\tlookup: async () => [\n\t\t\t\t{ address: "::1", family: 6 },\n\t\t\t\t{ address: "127.0.0.1", family: 4 }\n\t\t\t]\n\t\t});\n\t\tassert.equal(account.status, "ok");\n\t\tassert.equal(account.balance.remaining, 11);\n\t} finally {\n\t\tawait new Promise((resolve) => server.close(resolve));\n\t}\n\tconsole.log("real socket IPv6 failure falls back to pinned IPv4 without escaping ok");\n}\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          tests.write_text(text.replace(marker, insertion + marker, 1))
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Commit validated patch and remove bootstrap workflow
        run: |
          rm .github/workflows/apply-node24-pinned-fix.yml
          git config user.name "Ychris12138"
          git config user.email "194215355+Ychris12138@users.noreply.github.com"
          git add lib/accounts.js scripts/test-accounts.mjs .github/workflows/apply-node24-pinned-fix.yml
          git commit -m "fix: disable inner family autoselection for pinned requests"
          git push origin HEAD:fix/node24-pinned-transport
